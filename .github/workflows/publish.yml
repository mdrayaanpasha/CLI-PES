name: Publish dep-collide to npm

# Publishes via npm Trusted Publishing (OIDC) — no npm tokens or OTP needed.
# npm verifies the publish comes from this repo + workflow and creates a
# provenance attestation. Trigger by pushing a version tag (e.g. v0.1.0) or
# manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # REQUIRED for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collide # package.json lives in the collide/ subdir
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires a recent npm (>= 11.5.1).
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish (OIDC trusted publishing)
        run: npm publish
